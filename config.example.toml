# =============================================================================
# Monte Carlo Portfolio Simulator — Configuration
# =============================================================================
# IMPORTANT: The values below are PLACEHOLDER examples only.
# Replace ALL of them with your actual financial data before running.
# The default starting_wealth / annual_spending ratio is intentionally
# conservative — you must set these to reflect your real situation.
# =============================================================================
# All monetary values are in TODAY'S dollars (nominal). The simulator inflates
# spending forward each year using the stochastic inflation model. Investment
# returns are also nominal (not inflation-adjusted).
#
# Run the simulation: ./run_simulation.sh


# -----------------------------------------------------------------------------
# Personal / Demographic
# -----------------------------------------------------------------------------

# Your current age when the simulation starts
starting_age = 50

# Age you plan to stop working and drawing a salary
retirement_age = 60

# Age the simulation runs to.
end_age = 100


# -----------------------------------------------------------------------------
# Wealth & Contributions
# -----------------------------------------------------------------------------

# Current total investable portfolio value (savings + brokerage + 401k, etc.)
starting_wealth = 5000000

# Amount you invest per month before retirement. Stops at retirement_age.
monthly_contribution = 3000

# Your annual spending in TODAY'S dollars.
annual_spending = 60000

# Discretionary spending flexibility: how much you'll increase/decrease
# spending in unusually good or bad market years (0.05 = ±5%)
spending_volatility = 0.05

# Annual charitable giving as a fraction of remaining portfolio
charity_pct = 0.01


# -----------------------------------------------------------------------------
# Asset Allocation
# -----------------------------------------------------------------------------

# Fraction of portfolio held in equities (stocks). The remainder goes to bonds.
equity_allocation = 0.99


# -----------------------------------------------------------------------------
# Social Security
# -----------------------------------------------------------------------------

# Age at which Social Security benefits begin.
social_security_start_age = 67

# Annual Social Security benefit in TODAY'S dollars.
social_security_annual = 30000


# -----------------------------------------------------------------------------
# Simulation Scale
# -----------------------------------------------------------------------------

# Number of Monte Carlo simulation runs.
simulations = 10000


# -----------------------------------------------------------------------------
# Return & Inflation Assumptions
# -----------------------------------------------------------------------------

# Long-run average annual nominal equity return (target CAGR).
target_equity_cagr = 0.07

# Long-run average annual inflation rate (target).
target_inflation = 0.03


# -----------------------------------------------------------------------------
# Cash Wedge Settings
# -----------------------------------------------------------------------------

# Years of spending to keep in cash as emergency buffer
cash_wedge_years = 0


# -----------------------------------------------------------------------------
# Block Bootstrap Settings
# -----------------------------------------------------------------------------

# Block sizes for sampling historical periods (years)
bootstrap_block_sizes = [5, 10, 15, 20, 30, 40]

# Stress the first N retirement years with a bad historical block.
stress_first_n_years = 10


# -----------------------------------------------------------------------------
# One-Time Financial Events
# -----------------------------------------------------------------------------
# Lump-sum additions (positive) or withdrawals (negative) at specific ages.
# Format: age (as string key) = dollar amount in TODAY'S dollars
# Examples: "55" = -50000 (home renovation), "65" = 200000 (inheritance)

[one_time_events]
"55" = -50000
"65" = 200000