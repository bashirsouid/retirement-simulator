# =============================================================================
# Monte Carlo Portfolio Simulator — Configuration
# =============================================================================
# All monetary values are in TODAY'S dollars. The simulator inflates spending,
# Social Security, pre-Medicare extras, one-time events, and (optionally)
# contributions using the bootstrapped CPI path.
#
# Copy to config.toml and edit:  cp config.example.toml config.toml
# Run: ./run_simulation.sh
# =============================================================================


# -----------------------------------------------------------------------------
# Personal / Demographic
# -----------------------------------------------------------------------------

starting_age = 50
retirement_age = 60
end_age = 100


# -----------------------------------------------------------------------------
# Wealth & Contributions
# -----------------------------------------------------------------------------

starting_wealth = 5000000
monthly_contribution = 3000

# Grow monthly_contribution with simulated inflation each working year.
# true  = contributions keep pace with prices (typical for a paycheck)
# false = the dollar amount you typed is used every year, unadjusted
inflate_contributions = true

# Core lifestyle spending in TODAY'S dollars. Inflated each year after
# retirement. Do not include pre-Medicare health insurance here if you
# set pre_medicare_extra_annual below.
annual_spending = 60000

# Discretionary spending flexibility in good/bad equity years (0.05 = ±5%)
spending_volatility = 0.05

# Annual charitable giving as a fraction of remaining portfolio
charity_pct = 0.01


# -----------------------------------------------------------------------------
# Taxes on portfolio withdrawals
# -----------------------------------------------------------------------------
# Applied only to the portfolio draw after Social Security has offset spending.
#   0.00 = you already included tax in annual_spending
#   0.10 to 0.15 = typical if annual_spending is a "lifestyle" number and
#                  most withdrawals will come from pretax accounts
# There is no full tax engine. If your tax picture is unusual, leave this
# at 0.0 and fold taxes into annual_spending yourself.
withdrawal_tax_rate = 0.0


# -----------------------------------------------------------------------------
# Pre-Medicare health insurance
# -----------------------------------------------------------------------------
# Extra annual spending (TODAY'S dollars) while you are retired and younger
# than medicare_age. Use this for marketplace / COBRA premiums. It is added
# on top of annual_spending and is not cut by guardrails.
# Set to 0 if you retire at or after Medicare age, or if that cost is
# already inside annual_spending.
medicare_age = 65
pre_medicare_extra_annual = 0


# -----------------------------------------------------------------------------
# Asset Allocation
# -----------------------------------------------------------------------------

# Fraction of portfolio held in equities. Remainder uses bond_return_override.
equity_allocation = 0.99


# -----------------------------------------------------------------------------
# Social Security
# -----------------------------------------------------------------------------

social_security_start_age = 67
social_security_annual = 30000


# -----------------------------------------------------------------------------
# Simulation Scale
# -----------------------------------------------------------------------------

simulations = 10000


# -----------------------------------------------------------------------------
# Return & Inflation Assumptions
# -----------------------------------------------------------------------------
# Fund fees are not a separate input. Subtract your all-in expense ratio
# from target_equity_cagr (for example 0.07 - 0.0015 = 0.0685). That is
# more accurate than a single fee field when you hold several funds.

target_equity_cagr = 0.07
target_inflation = 0.03


# -----------------------------------------------------------------------------
# Cash Wedge Settings
# -----------------------------------------------------------------------------

cash_wedge_years = 0


# -----------------------------------------------------------------------------
# Block Bootstrap Settings
# -----------------------------------------------------------------------------
# Short blocks recombine history more freely while still keeping multi-year
# crash sequences together. Longer 30-40 year blocks from a 54-year sample
# are almost the same few overlapping lifetimes.

bootstrap_block_sizes = [4, 5, 6, 8]

# Stress the first N retirement years with a bad historical block.
stress_first_n_years = 10


# -----------------------------------------------------------------------------
# One-Time Financial Events
# -----------------------------------------------------------------------------
# Lump-sum additions (positive) or withdrawals (negative) at specific ages.
# Amounts are TODAY'S dollars and are inflated to the event year.
# Examples: "55" = -50000 (home renovation), "65" = 200000 (inheritance)

[one_time_events]
"55" = -50000
"65" = 200000
