# =============================================================================
# Retirement Simulator — Global Equity Block Bootstrap Configuration
# =============================================================================
# Engine: MSCI World gross total returns (1970-2023, 54 years) sampled in
# random variable-length blocks, then shifted in log-space so each path's
# long-run CAGR matches target_equity_cagr. This preserves the real shape of
# history — crash depth, volatility, sequence-of-returns risk — while applying
# a forward-looking return assumption that discounts the unrepeatable
# US-superpower premium embedded in raw S&P 500 data.
# =============================================================================

starting_age   = 40
retirement_age = 62
end_age        = 100

starting_wealth      = 35000
monthly_contribution = 1000
annual_spending      = 60000

# Spending flex: scale up/down by this fraction in above/below-average equity years.
spending_volatility = 0.10

# Annual charitable giving as fraction of portfolio balance.
charity_pct = 0.00

# 1.0 = 100% global equity. Remainder earns bond_return_override.
equity_allocation = 0.80

social_security_start_age = 62
social_security_annual    = 30000

simulations = 10000

# ---------------------------------------------------------------------------
# Return assumptions — the primary human levers for calibrating expectations
# ---------------------------------------------------------------------------
# target_equity_cagr: forward-looking nominal equity CAGR. Each bootstrapped
#   path is shifted to this target. 7.0% nominal ≈ 4.0% real.
#   - Raw MSCI World history (1970-2023): ~9.7% nominal geo mean
#   - DMS Yearbook 2025 global DM forward estimate: ~6-7% nominal
#   - Lower = more conservative; set to 0.097 to use raw history unmodified.
target_equity_cagr = 0.07

# target_inflation: nominal CPI assumption per year.
#   Each bootstrapped inflation path is shifted to this target.
#   3.0% is modestly above the Fed 2% target to account for structural risk.
target_inflation = 0.03

# ---------------------------------------------------------------------------
# Cash wedge / bucket strategy
# ---------------------------------------------------------------------------
# cash_wedge_years: years of inflation-adjusted spending held in cash at
#   retirement. Set to 0 to disable entirely.
# cash_wedge_refill_rule: "five_year_mean" — use wedge when recent 5-year avg
#   return is below the target CAGR; "negative_year" — use in any down year.
# cash_wedge_escape_velocity: dissolve the wedge permanently once WR drops
#   below this fraction of the initial retirement WR (portfolio has grown
#   enough that sequence-of-returns risk is no longer a concern).
cash_wedge_years           = 1.5
cash_wedge_refill_rule     = "five_year_mean"
cash_wedge_escape_velocity = 0.25

# Nominal annual returns for cash bucket and bond allocation.
# Set to 0.0 for a conservative (cash earns nothing real) assumption.
#cash_return_override = 0.0
#bond_return_override = 0.0

# Block sizes (years) used to stitch historical blocks together.
bootstrap_block_sizes = [5, 10, 15, 20]

# ---------------------------------------------------------------------------
# One-time cash events (positive = inflow, negative = outflow)
# Keys are ages as quoted strings.
# ---------------------------------------------------------------------------
[one_time_events]
# "45" = 1000000   # inheritance, business sale, equity vest, etc.
# "55" = -100000   # large purchase, house renovation, etc.
# "60" = 250000    # pension lump sum, deferred comp, etc.
