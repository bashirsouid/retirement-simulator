# =============================================================================
# Copy to config.toml and edit. All money is TODAY'S dollars; the sim inflates
# spending, SS, pre-Medicare extra, events, and (if enabled) contributions.
# Run: ./run_simulation.sh
# =============================================================================

# --- Ages ---
starting_age   = 50   # your age now
retirement_age = 60   # last working year is retirement_age; spending starts here
end_age        = 100  # plan through this age (every path runs the full horizon)


# --- Portfolio & saving ---
starting_wealth = 250000          # investable assets only (not personal home equity)
monthly_contribution = 500        # stops at retirement_age
inflate_contributions = true      # true = raise contributions with CPI each working year

# Core lifestyle spend. Inflated after retirement. Exclude pre-Medicare premiums
# if you set pre_medicare_extra_annual below.
annual_spending = 60000

spending_volatility = 0.05        # ± this fraction in good/bad equity years
charity_pct = 0.00                # fraction of portfolio given each year; 0 disables


# --- Withdrawal tax ---
# Tax on the portfolio draw after SS has offset spending.
# 0.00 = tax is already inside annual_spending
# 0.10–0.15 = typical if annual_spending is a pretax lifestyle number
withdrawal_tax_rate = 0.0


# --- Pre-Medicare health insurance ---
# Added only while retired and younger than medicare_age. Not cut by guardrails.
# Look up plans: https://www.healthcare.gov/
# Unsubsidized silver in the 60s is often ~$8k–$15k/yr per person.
# After premium tax credits many people pay much less — use your quote.
# 0 if you retire at/after 65 or already included it in annual_spending.
medicare_age = 65
pre_medicare_extra_annual = 12000


# --- Allocation ---
equity_allocation = 0.60          # rest needs bond_return_override
bond_return_override = 0.03       # required if equity_allocation < 1; fixed nominal, not a bond index


# --- Social Security ---
# Benefit in TODAY'S dollars at the claiming age you pick (not the future
# inflated check). Get your estimate: https://www.ssa.gov/myaccount/
# Use the line for this claiming age (62 / FRA / 70).
social_security_start_age = 67
social_security_annual    = 30000


# --- Run size ---
simulations = 10000               # 10k is enough for stable percentiles


# --- Return assumptions ---
# No separate fee field: subtract all-in ER from the equity CAGR
# (e.g. 0.07 - 0.0015 = 0.0685).
target_equity_cagr = 0.07         # nominal; ~4% real at 3% inflation
target_inflation   = 0.03


# --- Cash wedge (optional) ---
cash_wedge_years = 0              # years of core spending held in cash; 0 disables


# --- Bootstrap ---
bootstrap_block_sizes = [4, 5, 6, 8]   # historical slice lengths, years
stress_first_n_years = 10              # 0 disables the bad-opening-years run


# --- One-time events ---
# Today's dollars, inflated to that age. + inflow, − outflow.
[one_time_events]
"55" = -50000
"65" = 200000
